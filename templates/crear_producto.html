<div class="card form-card">
  <h2 id="form-title">Crear nuevo producto</h2>
  <form id="producto-form">
    <input id="producto-id" name="producto-id" type="hidden" />

    <label for="titulo">Título</label>
    <input id="titulo" name="titulo" type="text" required />

    <label for="categoria">Categoría</label>
    <input id="categoria" name="categoria" type="text" required />

    <label for="precio">Precio</label>
    <input id="precio" name="precio" type="number" step="0.01" required />

    <label for="descripcion">Descripción</label>
    <textarea id="descripcion" name="descripcion" rows="4" required></textarea>

    <div class="button-row">
      <button class="button primary" type="submit" id="submit-button">Crear producto</button>
      <button class="button secondary" type="button" id="cancel-button" style="display:none;">Cancelar</button>
    </div>
    <div id="form-message" class="form-message"></div>
  </form>
</div>
